<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Speed Rush 2.0</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #070707;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #00ff88;
    margin: 15px 0 5px;
}

.instructions {
    color: #aaa;
    margin-bottom: 12px;
}

.hud {
    width: min(900px, 94vw);
    margin: auto;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.panel {
    background: #151515;
    padding: 10px 18px;
    border: 1px solid #333;
    flex: 1;
}

.health {
    height: 12px;
    background: #333;
    margin-top: 6px;
}

.health div {
    height: 100%;
    width: 100%;
}

#health1 {
    background: #00aaff;
}

#health2 {
    background: #ff3333;
}

#game {
    position: relative;
    width: min(900px, 94vw);
    height: 600px;
    margin: 15px auto;
    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            #16702f 0%,
            #16702f 12%,
            #444 12%,
            #444 88%,
            #16702f 88%,
            #16702f 100%
        );

    border: 4px solid #00ff88;
}

/* Road */

.road-line {
    position: absolute;
    width: 8px;
    height: 100px;
    background: white;
    left: 50%;
    transform: translateX(-50%);
}

.line1 { top: -100px; }
.line2 { top: 100px; }
.line3 { top: 300px; }
.line4 { top: 500px; }

.road-line {
    animation: road 0.7s linear infinite;
}

@keyframes road {
    from {
        transform: translate(-50%, -200px);
    }

    to {
        transform: translate(-50%, 200px);
    }
}

/* Cars */

.car {
    position: absolute;
    width: 55px;
    height: 90px;
    border-radius: 12px;
    z-index: 5;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;

    box-shadow: 0 5px 15px #000;
}

#car1 {
    background: #008cff;
    left: 30%;
    bottom: 40px;
}

#car2 {
    background: #ff3333;
    left: 60%;
    bottom: 40px;
}

/* Obstacles */

.obstacle {
    position: absolute;
    width: 55px;
    height: 70px;
    background: #111;
    border: 3px solid #ffcc00;
    border-radius: 8px;

    font-size: 30px;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* Finish */

#finish {
    position: absolute;
    top: -30px;
    width: 100%;
    height: 25px;

    background:
        repeating-linear-gradient(
            90deg,
            white 0,
            white 25px,
            black 25px,
            black 50px
        );

    z-index: 3;
}

/* Message */

#message {
    min-height: 28px;
    font-size: 22px;
    font-weight: bold;
}

/* Button */

button {
    background: #00ff88;
    color: black;
    border: none;

    padding: 12px 28px;

    font-weight: bold;
    cursor: pointer;

    margin-bottom: 10px;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00ff88;
}

</style>
</head>

<body>

<h1>🏎️ SPEED RUSH 2.0</h1>

<div class="instructions">
    🔵 P1: A / D + W &nbsp;&nbsp; | &nbsp;&nbsp;
    🔴 P2: ← / → + ↑
</div>

<div class="hud">

    <div class="panel">
        🔵 PLAYER 1

        <div class="health">
            <div id="health1"></div>
        </div>
    </div>

    <div class="panel">
        ⏱️ TIME

        <div id="timer">
            60
        </div>
    </div>

    <div class="panel">
        🔴 PLAYER 2

        <div class="health">
            <div id="health2"></div>
        </div>
    </div>

</div>

<p id="message">
    Press START RACE!
</p>

<button onclick="startRace()">
    START RACE
</button>

<div id="game">

    <div id="finish"></div>

    <div class="road-line line1"></div>
    <div class="road-line line2"></div>
    <div class="road-line line3"></div>
    <div class="road-line line4"></div>

    <div id="car1" class="car">
        🏎️
    </div>

    <div id="car2" class="car">
        🚗
    </div>

</div>

<script>

const game =
    document.getElementById("game");

const car1 =
    document.getElementById("car1");

const car2 =
    document.getElementById("car2");

const health1 =
    document.getElementById("health1");

const health2 =
    document.getElementById("health2");

const timerText =
    document.getElementById("timer");

const message =
    document.getElementById("message");


const keys = {};

let running = false;

let time = 60;

let healthP1 = 100;
let healthP2 = 100;

let speed1 = 0;
let speed2 = 0;

let obstacles = [];

let timer;


document.addEventListener(
    "keydown",
    event => {

        keys[event.key.toLowerCase()] = true;

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.key.toLowerCase()] = false;

    }
);


function startRace() {

    running = true;

    time = 60;

    healthP1 = 100;
    healthP2 = 100;

    speed1 = 0;
    speed2 = 0;

    timerText.textContent = time;

    health1.style.width = "100%";
    health2.style.width = "100%";

    message.textContent =
        "🏁 RACE STARTED!";

    car1.style.left = "30%";
    car2.style.left = "60%";

    obstacles.forEach(
        obstacle => obstacle.remove()
    );

    obstacles = [];

    createObstacle();
    createObstacle();
    createObstacle();

    clearInterval(timer);

    timer = setInterval(() => {

        if (!running) {
            return;
        }

        time--;

        timerText.textContent = time;

        if (time <= 0) {

            endRace();

        }

    }, 1000);

}


function createObstacle() {

    const obstacle =
        document.createElement("div");

    obstacle.className =
        "obstacle";

    obstacle.textContent = "🚧";

    obstacle.style.left =
        (20 + Math.random() * 60) + "%";

    obstacle.style.top =
        (-100 - Math.random() * 300) + "px";

    game.appendChild(obstacle);

    obstacles.push(obstacle);

}


function moveCars() {

    if (!running) {
        return;
    }

    const acceleration = 0.12;

    const maxSpeed = 4;

    /* PLAYER 1 */

    if (keys["w"]) {
        speed1 += acceleration;
    } else {
        speed1 *= 0.97;
    }

    if (keys["a"]) {
        car1.style.left =
            (parseFloat(car1.style.left || 30) - 0.6) + "%";
    }

    if (keys["d"]) {
        car1.style.left =
            (parseFloat(car1.style.left || 30) + 0.6) + "%";
    }


    /* PLAYER 2 */

    if (keys["arrowup"]) {
        speed2 += acceleration;
    } else {
        speed2 *= 0.97;
    }

    if (keys["arrowleft"]) {
        car2.style.left =
            (parseFloat(car2.style.left || 60) - 0.6) + "%";
    }

    if (keys["arrowright"]) {
        car2.style.left =
            (parseFloat(car2.style.left || 60) + 0.6) + "%";
    }


    speed1 =
        Math.min(speed1, maxSpeed);

    speed2 =
        Math.min(speed2, maxSpeed);


    /* Keep cars on road */

    let p1 =
        parseFloat(car1.style.left || 30);

    let p2 =
        parseFloat(car2.style.left || 60);

    p1 = Math.max(14, Math.min(p1, 82));

    p2 = Math.max(14, Math.min(p2, 82));

    car1.style.left = p1 + "%";
    car2.style.left = p2 + "%";


    /* Move obstacles */

    obstacles.forEach(obstacle => {

        let y =
            parseFloat(
                obstacle.style.top
            );

        y += 2 + Math.max(
            speed1,
            speed2
        );

        obstacle.style.top =
            y + "px";


        if (y > game.clientHeight) {

            obstacle.style.top =
                (-100 - Math.random() * 200) + "px";

            obstacle.style.left =
                (20 + Math.random() * 60) + "%";

        }


        checkCollision(
            car1,
            obstacle,
            1
        );

        checkCollision(
            car2,
            obstacle,
            2
        );

    });

}


function checkCollision(
    car,
    obstacle,
    player
) {

    const a =
        car.getBoundingClientRect();

    const b =
        obstacle.getBoundingClientRect();


    if (
        a.left < b.right &&
        a.right > b.left &&
        a.top < b.bottom &&
        a.bottom > b.top
    ) {

        obstacle.style.top =
            "-150px";


        if (player === 1) {

            healthP1 -= 20;

            health1.style.width =
                healthP1 + "%";

        } else {

            healthP2 -= 20;

            health2.style.width =
                healthP2 + "%";

        }


        if (
            healthP1 <= 0 ||
            healthP2 <= 0
        ) {

            endRace();

        }

    }

}


function endRace() {

    running = false;

    clearInterval(timer);


    if (
        healthP1 > healthP2
    ) {

        message.textContent =
            "🏆 PLAYER 1 WINS!";

    } else if (
        healthP2 > healthP1
    ) {

        message.textContent =
            "🏆 PLAYER 2 WINS!";

    } else {

        message.textContent =
            "🤝 DRAW!";

    }

}


function gameLoop() {

    moveCars();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
